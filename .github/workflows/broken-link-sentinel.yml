name: OER Broken-Link Sentinel

on:
  schedule:
    - cron: '0 0 * * 0' # Dijalankan setiap hari Minggu pukul 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  audit-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Broken-Link Sentinel Audit
        run: |
          python scripts/check_broken_links.py

      - name: Upload Sentinel Audit Report
        uses: actions/upload-artifact@v4
        with:
          name: broken-link-report
          path: data/broken_link_report.md
          retention-days: 30
