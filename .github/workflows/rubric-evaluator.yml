name: Rubric Submission Evaluator

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  grade:
    name: Evaluate Architecture Submissions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Rubric Grader on Cases
        run: |
          python3 -c "
          import glob, os, subprocess
          files = glob.glob('cases/**/*.json', recursive=True) + glob.glob('showcase/**/*.json', recursive=True)
          if not files:
              print('Tidak ditemukan berkas submission baru untuk dinilai.')
          for f in files:
              print(f'Mengevaluasi {f}...')
              subprocess.run(['python3', 'scripts/rubric_grader.py', f], check=True)
          "
